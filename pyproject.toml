[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "antfarm-ai"
version = "0.1.0"
description = "Reproducible artificial-society simulations"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10,<3",
    "ruamel-yaml>=0.18,<0.19",
]

[project.scripts]
antfarm = "antfarm.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.14,<2",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
    "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/antfarm"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["antfarm"]

