schema_version: 1
run:
  id: social-ollama
  seed: 73
  ticks: 3
providers:
  local-ollama:
    kind: openai_compatible
    base_url: http://localhost:11434/v1
models:
  qwen-local:
    provider_ref: local-ollama
    model: qwen3.5:0.8b
    timeout_seconds: 180
    parameters:
      temperature: 0
      seed: 73
      reasoning_effort: none
      max_tokens: 256
personalities:
  cautious:
    description: Protect the shared resource and clearly explain concerns.
    traits:
      risk_tolerance: low
  pragmatic:
    description: Balance personal needs with practical cooperation.
    traits:
      cooperation: medium
  generous:
    description: Listen to others and favor the common good.
    traits:
      cooperation: high
agents:
  - id: alice
    model_ref: qwen-local
    personality_ref: cautious
  - id: bob
    model_ref: qwen-local
    personality_ref: pragmatic
  - id: charlie
    model_ref: qwen-local
    personality_ref: generous
actions:
  - kind: harvest
  - kind: contribute
  - kind: say
environment:
  kind: commons
  initial_resource: 6
  initial_endowment: 1
  social:
    message_max_length: 240
    history_limit: 8
    roster_limit: 10
memory:
  kind: in_memory
  recall_limit: 8
  retention_limit: 16
scheduling:
  kind: stable
metrics:
  - action_count
  - rejection_count
  - failure_count
  - agent_outcomes
storage:
  kind: memory
