schema_version: 1
run: {id: society-randomized, seed: 101, ticks: 1}
providers: {scripted: {kind: mock}}
models: {shared: {provider_ref: scripted, model: no-op}}
population:
  mode: generated
  seed: 404
  generated: {id_prefix: citizen, count: 4, model_ref: shared}
  randomize:
    behavioral_traits:
      mode: all
      default: {minimum: 0.1, maximum: 0.9}
    economics:
      money: {minimum: 5, maximum: 100}
      recurring_income: {minimum: 1, maximum: 12}
      resources: {tools: {minimum: 0, maximum: 4}}
agents: []
actions: [{kind: harvest}, {kind: contribute}]
environment: {kind: commons, initial_resource: 12, initial_endowment: 2}
memory: {kind: in_memory, recall_limit: 5, retention_limit: 10}
scheduling: {kind: stable, interval: 1}
storage: {kind: memory}
