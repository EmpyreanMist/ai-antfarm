schema_version: 1
run:
  id: social-mock
  seed: 71
  ticks: 3
providers:
  scripted:
    kind: mock
    decisions:
      alice:
        - kind: say
          parameters:
            text: Let us preserve enough resources for everyone.
        - kind: harvest
          parameters:
            amount: 1
        - kind: contribute
          parameters:
            amount: 1
      bob:
        - kind: harvest
          parameters:
            amount: 1
        - kind: say
          parameters:
            text: I agree and will return what I can.
        - kind: contribute
          parameters:
            amount: 1
      charlie:
        - kind: say
          parameters:
            text: I will watch the commons before acting.
        - kind: harvest
          parameters:
            amount: 1
        - kind: say
          parameters:
            text: The resource still looks healthy.
models:
  shared-model:
    provider_ref: scripted
    model: fixed-social-decisions
personalities:
  cautious:
    description: Protect the shared resource and communicate concerns.
    traits:
      risk_tolerance: low
  pragmatic:
    description: Balance personal needs with cooperation.
    traits:
      cooperation: medium
  observant:
    description: Listen carefully before choosing an action.
    traits:
      attentiveness: high
agents:
  - id: alice
    model_ref: shared-model
    personality_ref: cautious
  - id: bob
    model_ref: shared-model
    personality_ref: pragmatic
  - id: charlie
    model_ref: shared-model
    personality_ref: observant
actions:
  - kind: harvest
  - kind: contribute
  - kind: say
environment:
  kind: commons
  initial_resource: 5
  initial_endowment: 0
  social:
    message_max_length: 240
    history_limit: 6
    roster_limit: 10
memory:
  kind: in_memory
  recall_limit: 6
  retention_limit: 12
scheduling:
  kind: stable
metrics:
  - action_count
  - rejection_count
  - failure_count
  - agent_outcomes
storage:
  kind: memory
